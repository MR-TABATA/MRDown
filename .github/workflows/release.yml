name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            // 本文はリポジトリの中から取る。タグを打ったあとに web の編集画面で
            // 記憶から書くのをやめるため — 機能を作った PR の中で、その機能を
            // いちばん覚えているときに書ける。無ければ既定の一行で、リリース
            // 自体は止めない（どのみち draft で止まるので、そこで気づく）。
            const notes = `.github/release-notes/${tag}.md`;
            const body = fs.existsSync(notes)
              ? fs.readFileSync(notes, 'utf8')
              : 'See the assets below to download and install this version.';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `MRDown ${tag}`,
              body,
              draft: true,
              prerelease: false,
            })
            return data.id

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          # Apple の Developer ID 中間証明書。これが無いと署名チェーンを検証できず
          # find-identity -v が 0 件になり、署名が黙って失敗する。
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}' || true)
          if [ -z "$CERT_ID" ]; then
            echo "::error::有効な Developer ID Application 署名 ID がキーチェーンに見つからない。APPLE_CERTIFICATE の中身を確認すること。" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          rm certificate.p12 DeveloperIDG2CA.cer

      - name: Write App Store Connect API key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/api_key.p8" >> "$GITHUB_ENV"

      # Build only — the upload happens below, after the DMG is stapled. Tauri
      # notarizes and staples the .app, but it only *signs* the DMG that wraps
      # it, so a downloaded DMG had no ticket of its own to show Gatekeeper.
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          args: ${{ matrix.args }}

      - name: Notarize and staple the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/*/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::DMG が見つからない。bundle の出力先が変わった可能性がある。" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
            # 配布物に切符が焼き込まれたことを確認する。オフラインの Mac でも
            # Gatekeeper が通るのはこれが通っている場合だけ。
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -v "$dmg"
          done

      - name: Upload to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          staged="$RUNNER_TEMP/assets"
          mkdir -p "$staged"
          # The DMG carries its architecture in the filename already.
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            cp "$dmg" "$staged/"
          done
          # The .app tarball does not — every arch bundles it as MRDown.app.tar.gz,
          # so uploading it as-is means the second job in the matrix clobbers the
          # first and we ship one tarball of unknown architecture. Name it here.
          for tgz in src-tauri/target/*/release/bundle/macos/*.app.tar.gz; do
            cp "$tgz" "$staged/MRDown_${{ matrix.arch }}.app.tar.gz"
          done
          gh release upload "${GITHUB_REF_NAME}" "$staged"/* --clobber

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build]
    steps:
      # ひとつ前のタグを知るために全履歴が要る。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 手で書くのは本文だけにする。ここから下は毎回まったく同じ形で、しかも
      # 手で書くと版番号とファイル名を打ち間違えるところ。
      #
      # 本文を release から読まずに毎回組み直すのは、再実行しても footer が
      # 二重に付かないようにするため。
      - name: Append the download footer to the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes=".github/release-notes/${tag}.md"
          if [ -f "$notes" ]; then
            cp "$notes" body.md
          else
            echo 'See the assets below to download and install this version.' > body.md
            echo "::warning::${notes} が無い。本文が既定の一行のままになっている。"
          fi

          # 資産は「実際に上がったもの」を読む。テンプレートに版番号を差し込む
          # 形にすると、配るアーキテクチャが変わった版で嘘の行が出る。
          dmgs=$(gh release view "$tag" --json assets -q '.assets[].name' | grep '\.dmg$' | sort || true)
          if [ -n "$dmgs" ]; then
            printf '\n---\n\n**Download**\n\n' >> body.md
            while IFS= read -r dmg; do
              case "$dmg" in
                *aarch64*) printf -- '- Apple Silicon: `%s`\n' "$dmg" ;;
                *x64*|*x86_64*) printf -- '- Intel: `%s`\n' "$dmg" ;;
                *) printf -- '- `%s`\n' "$dmg" ;;
              esac >> body.md
            done <<< "$dmgs"
          else
            echo "::warning::DMG が1つも上がっていない。"
          fi

          # 最初のタグのときは比べる先が無いので、その行は出さない。
          prev=$(git tag --sort=-v:refname | awk -v cur="$tag" 'f { print; exit } $0 == cur { f = 1 }')
          if [ -n "$prev" ]; then
            printf '\nFull changelog: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$tag" >> body.md
          fi

          gh release edit "$tag" --notes-file body.md

      - name: Keep release as draft for manual review
        run: echo "All assets uploaded to draft release ${{ needs.create-release.outputs.release_id }}. Review and publish manually."
